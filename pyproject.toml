[project]
name = "graphrag-sdk-comparison"
version = "0.1.0"
description = "RAG vs Agentic RAG vs GraphRAG on Neo4j, built with the Anthropic Python SDK and the Claude Agent SDK"
requires-python = ">=3.10"
dependencies = [
  "anthropic>=0.40",
  "claude-agent-sdk>=0.1",
  "openai>=1.50",
  "neo4j>=5.20",
  "langchain-text-splitters>=0.3",
  "langchain-core>=0.3",
  "llama-parse>=0.5",
  "python-dotenv>=1.0",
  "pyyaml>=6.0",
  "typer>=0.12",
  "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
graphrag-cmp = "graphrag_cmp.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/graphrag_cmp"]

[tool.ruff]
line-length = 100

[tool.ruff.lint.per-file-ignores]
"src/graphrag_cmp/cli.py" = ["B008"]  # typer.Option defaults are the Typer idiom
